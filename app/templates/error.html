{% extends "base.html" %}
{% block title %}Error {{ code }} — FoodLoop ID{% endblock %}
{% block content %}
<section class="mx-auto max-w-lg py-16 text-center">
  <div class="card p-8">
    <p class="text-5xl font-bold text-primary-700">{{ code }}</p>
    <h1 class="mt-3 text-xl font-semibold text-ink">Permintaan tidak dapat diproses</h1>
    <p class="mt-2 text-sm text-ink-muted">{{ message }}</p>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Masuk</a>
    </div>
  </div>
</section>
{% endblock %}
